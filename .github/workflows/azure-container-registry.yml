name: Build and Deploy Container

on:
  schedule:
    - cron: '15 17 * * *'
  push:
    branches: [ main, develop ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production
      registry:
        description: 'Container Registry'
        required: true
        default: 'both'
        type: choice
        options:
          - ghcr
          - acr
          - both
  workflow_call:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: false
        default: 'dev'
        type: string
      registry:
        description: 'Container Registry'
        required: false
        default: 'both'
        type: string

env:
  # GitHub Container Registry
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: ${{ github.repository }}
  
  # Azure Container Registry
  ACR_NAME: ${{ secrets.ACR_NAME }}  # e.g., myacr (without .azurecr.io)
  ACR_IMAGE_NAME: adventureworks2019
  
jobs:
  # Build and push to GitHub Container Registry using docker-publish workflow
  integration:
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      checks: write
    secrets: inherit

  # Build and push to Azure Container Registry (ACR)
  build-and-push-acr:
    needs: [integration]
    runs-on: ubuntu-latest
    if: github.event.inputs.registry == 'acr' || github.event.inputs.registry == 'both' || github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download DACPAC artifact
        uses: actions/download-artifact@v4
        with:
          name: dacpac-package
          path: bin/Output

      - name: Verify DACPAC
        run: |
          if [ -f "bin/Output/AdventureWorks2019.dacpac" ]; then
            echo "✓ DACPAC found and ready for Docker build"
            ls -lh bin/Output
          else
            echo "✗ DACPAC not found!"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata (tags, labels) for ACR
        id: meta-acr
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.ACR_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image to ACR
        id: build-and-push-acr
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-acr.outputs.tags }}
          labels: ${{ steps.meta-acr.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.ACR_NAME }}.azurecr.io/${{ env.ACR_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ secrets.ACR_NAME }}.azurecr.io/${{ env.ACR_IMAGE_NAME }}:buildcache,mode=max

      - name: ACR Image Summary
        run: |
          echo "✅ Image pushed to Azure Container Registry!"
          echo "Registry: ${{ secrets.ACR_NAME }}.azurecr.io"
          echo "Image: ${{ env.ACR_IMAGE_NAME }}"
          echo "Tags: ${{ steps.meta-acr.outputs.tags }}"
          echo "Digest: ${{ steps.build-and-push-acr.outputs.digest }}"
